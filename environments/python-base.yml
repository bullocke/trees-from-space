# Trees from Space: Python environment for the introductory lessons.
#
# Create (CHPC: run on a login node after `module purge; module load miniforge3`):
#   mamba env create -p <prefix>/tfs-python -f environments/python-base.yml
# then register the kernel:  <prefix>/tfs-python/bin/python scripts/install_kernels.py
#
# Minor versions of the geospatial stack are pinned: it keeps the environment
# reproducible and keeps the dependency solve small enough for an 8 GB laptop.
# Packages for later lessons (HDF5, STAC, xarray) are added when those lessons
# are implemented. The validated, exact versions are in the matching lockfile.
name: tfs-python
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # Data access
  - earthaccess>=0.16
  - requests
  # Geospatial and analysis
  - rasterio=1.5
  - libgdal-core=3.12
  - pyproj=3.7
  - geopandas=1.2
  - shapely=2.2
  - numpy=2.4
  - pandas=3.0
  - matplotlib=3.11
  # Notebooks: the kernel, a Jupyter server for OnDemand "Custom" sessions,
  # and papermill for batch runs on a data transfer node
  - ipykernel
  - ipywidgets
  - jupyterlab
  - notebook
  - papermill
